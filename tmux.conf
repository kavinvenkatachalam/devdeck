# devdeck's private tmux server (tmux -L devdeck). The browser draws the tab bar, so tmux's is off.
set -g status off
set -g mouse on
set -g history-limit 50000
set -s escape-time 0
set -g focus-events on
# selections made with the mouse reach the browser clipboard (OSC 52 → xterm clipboard addon)
set -g set-clipboard on
set -as terminal-features ",xterm-256color:clipboard"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
# Phone and laptop share windows: size each window to whichever client typed last.
set -g window-size latest
# grouped viewer sessions can look at different windows; size each window by its own viewers
setw -g aggressive-resize on
